      const seen = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("seen");
              seen.unobserve(e.target);
            }
          }),
        { threshold: 0.12 },
      );
      document
        .querySelectorAll("[data-reveal]")
        .forEach((e) => seen.observe(e));
      const menu = document.querySelector("[data-menu]"),
        toggle = document.querySelector("[data-menu-toggle]");
      toggle?.addEventListener("click", () => {
        const open = menu?.toggleAttribute("data-open");
        toggle.setAttribute("aria-expanded", String(open));
      });
      addEventListener("keydown", (e) => {
        if (e.key === "Escape" && menu?.hasAttribute("data-open")) {
          menu.removeAttribute("data-open");
          toggle?.setAttribute("aria-expanded", "false");
          toggle?.focus();
        }
      });
      const videos = [...document.querySelectorAll("video")];
      const finePointer =
        matchMedia("(pointer: fine)").matches &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches;
      const glow = document.querySelector(".ambient-light");
      let glowFrame = 0;
      let lightX = innerWidth * 0.66,
        lightY = innerHeight * 0.35;
      let targetX = lightX,
        targetY = lightY;
      const followLight = () => {
        glowFrame = 0;
        if (document.hidden || !glow) return;
        lightX += (targetX - lightX) * 0.065;
        lightY += (targetY - lightY) * 0.065;
        glow.style.setProperty("--pointer-x", lightX + "px");
        glow.style.setProperty("--pointer-y", lightY + "px");
        if (Math.abs(targetX - lightX) + Math.abs(targetY - lightY) > 0.5)
          glowFrame = requestAnimationFrame(followLight);
      };
      if (finePointer && glow)
        addEventListener(
          "pointermove",
          (event) => {
            targetX = event.clientX;
            targetY = event.clientY;
            if (!glowFrame) glowFrame = requestAnimationFrame(followLight);
          },
          { passive: true },
        );
      const conserve =
        matchMedia("(prefers-reduced-motion: reduce)").matches ||
        navigator.connection?.saveData;
      if (conserve)
        videos.forEach((v) => {
          v.autoplay = false;
          v.pause();
          v.preload = "metadata";
        });
      const videoObserver = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            const v = e.target;
            if (!e.isIntersecting) v.pause();
            else if (!conserve && v.autoplay) v.play().catch(() => {});
          }),
        { threshold: 0.05 },
      );
      videos.forEach((v) => videoObserver.observe(v));
      document.addEventListener("visibilitychange", () => {
        document.body.classList.toggle("motion-paused", document.hidden);
        if (document.hidden) videos.forEach((v) => v.pause());
      });
    </script></body></html>
